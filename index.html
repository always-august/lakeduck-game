<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꽥꽥런</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 16:9 고정 스테이지. --sw(스테이지 너비)에 맞춰 font-size가 바뀌고,
     UI 치수는 전부 em 단위라 창 크기에 비례해 같이 커지고 작아진다. (기준: 1280px 너비 = 16px) */
  :root {
    --bg:#f4f6fb; --card:#fff; --ink:#1d2433; --muted:#6b7488; --accent:#ff5a36; --line:#e2e6ef;
    --sw: min(100vw, calc(100vh * 16 / 9));
  }
  @supports (height: 100dvh) { :root { --sw: min(100vw, calc(100dvh * 16 / 9)); } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0f1a; }
  body { display:grid; place-items:center; color:var(--ink);
         font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
  #app { position:relative; width:var(--sw); height:calc(var(--sw) * 9 / 16); overflow:hidden;
         background:var(--bg); font-size:calc(var(--sw) / 80); }
  button { font:inherit; cursor:pointer; }
  [hidden] { display:none !important; }
  .screen { position:absolute; inset:0; }

  /* ── 설정 화면 (2단) ── */
  #setup { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr); gap:1.3em 1.6em; padding:1.8em 3em 2.2em;
           background:linear-gradient(135deg,#fff3ec 0%,#eef3ff 100%); }
  .col { display:flex; flex-direction:column; min-height:0; gap:1em; }
  .brand { grid-column:1 / -1; display:flex; align-items:center; gap:1.1em; }
  .brand .fs { margin-left:auto; align-self:flex-start; }
  .logo { height:8em; width:auto; flex:none; filter:drop-shadow(0 .25em .5em rgba(20,30,60,.12)); }
  .sponsor { margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:.7em; padding-bottom:.2em;
             color:var(--muted); font-size:.9em; font-weight:700; letter-spacing:.06em; }
  .sponsor img { height:5.2em; }
  #raceLogo { position:absolute; left:.8em; bottom:2.9em; height:6.5em; pointer-events:none; filter:drop-shadow(0 .2em .4em rgba(0,0,0,.25)); }
  .res-logo { height:5em; margin:0 auto .4em; display:block; }
  /* 결과 창 하단 후원: 구분선 아래 세로 배치, 로고 높이 2.4em(이전 1.2em의 2배) */
  .res-sponsor { display:flex; flex-direction:column; align-items:center; gap:.55em; color:var(--muted); font-size:.8em;
                 font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:1.5em; padding-top:1.3em; border-top:1px solid var(--line); }
  .res-sponsor img { height:3em; }
  .brand h1 { margin:0; font-size:2.3em; letter-spacing:-.02em; }
  .sub { margin:.3em 0 0; color:var(--muted); font-size:.92em; line-height:1.45; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:1em; padding:1.3em 1.4em;
          box-shadow:0 .4em 1.6em rgba(20,30,60,.07); }
  .names-card { flex:1; display:flex; flex-direction:column; min-height:0; }
  #names { flex:1; min-height:0; resize:none; line-height:1.5; }
  label { display:flex; justify-content:space-between; align-items:baseline; font-size:.85em; font-weight:700; margin:0 0 .45em; }
  label .cnt { color:var(--accent); font-weight:800; }
  .field { margin-bottom:1.1em; }
  textarea, input, select { width:100%; font:inherit; padding:.6em .75em; border:1px solid var(--line);
                            border-radius:.6em; background:#fafbfe; color:var(--ink); }
  textarea:focus, input:focus, select:focus { outline:2px solid rgba(255,90,54,.35); border-color:var(--accent); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:.9em; }
  .row.row3 { grid-template-columns:1fr 1fr 1.3fr; }
  .row.row3:first-child { grid-template-columns:0.95fr 1.4fr 0.8fr; }   /* 맵 | 거리(설명이 김) | 순위 방식 */
  .hint { color:var(--muted); font-size:.78em; margin:.5em 0 0; }
  .guide-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:.6em; padding:.6em .8em;
               border:1px solid var(--line); border-radius:2em; background:#f6f7fb; font-size:.9em; font-weight:700; color:var(--ink); }
  .guide-btn:hover, .guide-btn:focus-visible { border-color:var(--accent); background:#fff4ef; outline:none; }
  #itemGuideIcons { display:flex; gap:.25em; }
  #itemGuideIcons .pxi { height:1.3em; }
  .guide { position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:rgba(20,26,40,.45); }
  .guide-card { width:min(34em, 90%); background:var(--card); border-radius:1em; padding:1.3em 1.5em 1.1em; box-shadow:0 1em 3em rgba(0,0,0,.25); }
  .guide-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:.8em; }
  .guide-head b { font-size:1.15em; }
  .guide-head button { border:0; background:none; font-size:1.1em; color:var(--muted); padding:.2em .4em; }
  .guide-head button:hover { color:var(--accent); }
  #itemGuideList { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.55em; }
  #itemGuideList li { display:grid; grid-template-columns:2.2em 5.2em 1fr; align-items:center; gap:.6em; font-size:.92em; }
  #itemGuideList .ic { width:2.2em; height:2.2em; border-radius:.5em; display:flex; align-items:center; justify-content:center; }
  #itemGuideList .ic .pxi { height:1.5em; }
  #itemGuideList b { font-weight:800; }
  #itemGuideList span { color:var(--muted); }
  .field.last { margin-bottom:0; }
  #msg { color:#d6336c; font-weight:700; margin-left:.5em; }
  #go, #lkGo { padding:.85em; border:0; border-radius:.8em; background:var(--accent); color:#fff; font-size:1.3em; font-weight:800;
        box-shadow:0 .4em 1.2em rgba(255,90,54,.35); }
  #go:hover, #lkGo:hover:not(:disabled) { filter:brightness(1.05); }
  .fs { border:1px solid var(--line); background:#fff; border-radius:.6em; padding:.4em .7em; font-size:.8em; color:var(--muted); white-space:nowrap; }

  /* ── 경기 화면 ── */
  #race { background:#9fd8ff; }
  #stage, #labels { position:absolute; inset:0; }
  #stage canvas { display:block; width:100% !important; height:100% !important; }
  #labels { pointer-events:none; }
  .lbl { position:absolute; left:0; top:0; white-space:nowrap; font-size:.9em; font-weight:700; padding:.08em .45em; border-radius:.6em;
         background:rgba(255,255,255,.9); border-left:.3em solid #999; transform-origin:0 0; will-change:transform; }
  .lbl.win { background:#ffe066; }
  .panel { position:absolute; background:rgba(20,26,40,.72); color:#fff; border-radius:.75em; padding:.65em .8em; font-size:.82em; backdrop-filter:blur(4px); }
  #hud { top:.8em; left:.8em; width:15em; font-size:1.05em; padding:.75em .9em; }
  #goal { font-weight:800; margin-bottom:.45em; font-size:1.05em; }
  #ranks { margin:0; padding:0; list-style:none; }
  #ranks li { display:flex; align-items:center; gap:.5em; line-height:1.6; white-space:nowrap; }
  #ranks .no { flex:none; min-width:2.4em; font-weight:800; font-variant-numeric:tabular-nums; color:rgba(255,255,255,.6); }
  #ranks .nm { overflow:hidden; text-overflow:ellipsis; }
  #ranks li.top .no { color:#fff; }
  #ranks li.done, #ranks li.done .no { color:#ffd43b; }
  #ranks li.gap { padding-left:.6em; color:rgba(255,255,255,.8); font-weight:900; line-height:1.2; letter-spacing:.15em; }
  #progress { position:absolute; top:0; left:0; height:.25em; background:var(--accent); width:0; }
  #ctrls { bottom:.8em; right:.8em; display:flex; gap:.4em; padding:.4em; }
  #ctrls button { border:0; border-radius:.5em; padding:.5em .8em; background:rgba(255,255,255,.15); color:#fff; }
  #ctrls button:hover { background:rgba(255,255,255,.25); }
  #seedTag { bottom:.8em; left:.8em; font-size:.75em; padding:.4em .7em; }
  #toasts { position:absolute; top:.8em; right:.8em; display:flex; flex-direction:column; gap:.4em; align-items:flex-end; }
  .toast { background:rgba(20,26,40,.78); color:#fff; padding:.5em .85em; border-radius:.55em; font-size:1em; font-weight:600; animation:fade 2.6s forwards; }
  @keyframes fade { 0%{opacity:0;transform:translateY(-.4em)} 10%{opacity:1;transform:none} 80%{opacity:1} 100%{opacity:0} }
  #count { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:7.5em; font-weight:900; color:#fff;
           text-shadow:0 .05em .2em rgba(0,0,0,.35); pointer-events:none; }
  #slowTag { position:absolute; top:1em; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; font-weight:800;
             padding:.25em .8em; border-radius:1.2em; font-size:.9em; }

  /* ── 결과 ── */
  #result { background:rgba(10,14,24,.55); display:flex; align-items:center; justify-content:center; }
  #result .card { width:32em; max-height:94%; display:flex; flex-direction:column; text-align:center; padding:1.6em 1.9em 1.6em; }
  #result h2 { margin:0; font-size:1.6em; }
  /* 시상대: 2위 · 1위 · 3위 */
  .podium { display:grid; grid-template-columns:repeat(3, 1fr); align-items:end; gap:.45em; margin:1.1em .4em .5em;
            border-bottom:.25em solid #2b3242; }
  .pl { display:flex; flex-direction:column; align-items:stretch; min-width:0; }
  .pl.empty { visibility:hidden; }
  .pl .who { display:flex; flex-direction:column; align-items:center; gap:.15em; margin-bottom:.45em; min-width:0; }
  .pl .medal { font-size:1.9em; line-height:1; }
  .pl .nm { font-weight:800; font-size:1.12em; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl .step { display:flex; justify-content:center; padding-top:.35em; border-radius:.5em .5em 0 0;
              color:#fff; font-size:1.7em; font-weight:900; text-shadow:0 .06em 0 rgba(0,0,0,.2); }
  .pl.p1 .step { height:3.4em; background:linear-gradient(#f7cc1e, #dfac12); }
  .pl.p2 .step { height:2.5em; background:linear-gradient(#c9ced5, #a3a9b1); }
  .pl.p3 .step { height:1.9em; background:linear-gradient(#e0a06c, #b8733d); }
  .pl.p1 .nm { font-size:1.3em; }
  .more { margin:.2em 0 .3em; font-size:.85em; font-weight:700; color:var(--ink); }
  .more:empty { display:none; }
  .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5em; }
  .btns button { padding:.65em; border-radius:.6em; border:1px solid var(--line); background:#fff; font-size:.9em; }
  .btns button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* ── 최초 진입 메뉴 ── */
  #menu { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6em; padding:2em 3em;
          background:linear-gradient(135deg,#fff3ec 0%,#eef3ff 100%); }
  #menu .menu-head { display:flex; flex-direction:column; align-items:center; gap:.5em; }
  #menu .menu-head img { height:9em; filter:drop-shadow(0 .25em .5em rgba(20,30,60,.12)); }
  #menu .menu-head p { margin:0; color:var(--muted); font-size:1.05em; font-weight:600; }
  .menu-cards { display:grid; grid-template-columns:1fr 1fr; gap:1.4em; width:100%; max-width:46em; }
  .menu-card { display:flex; flex-direction:column; align-items:center; gap:.5em; padding:1.8em 1.4em 1.5em;
               background:var(--card); border:2px solid var(--line); border-radius:1.2em; cursor:pointer; font:inherit; color:var(--ink);
               box-shadow:0 .4em 1.6em rgba(20,30,60,.07); transition:transform .12s, border-color .12s, box-shadow .12s; }
  .menu-card:hover, .menu-card:focus-visible { transform:translateY(-.25em); border-color:var(--accent);
               box-shadow:0 .8em 2em rgba(255,90,54,.18); outline:none; }
  .menu-card .ico { font-size:4.2em; line-height:1; height:1.1em; display:flex; align-items:center; }
  .menu-card .ico img { height:1.15em; }
  .menu-card .ico img.icon3d { height:1.36em; margin:-.28em 0 -.2em;
  }
  .lk-empty .big img.icon3d { height:1.5em; image-rendering:auto; }
  .menu-card .ico img.icon3d { filter:drop-shadow(0 .06em .08em rgba(20,30,60,.18)); }
  .menu-card b { font-size:1.7em; font-weight:800; letter-spacing:-.02em; }
  .menu-card span { color:var(--muted); font-size:.95em; }
  .menu-card .go { margin-top:.5em; padding:.45em 1.4em; border-radius:2em; background:var(--accent); color:#fff; font-weight:800; font-size:.95em; }
  #menu .sponsor { margin-top:0; }
  .back { border:1px solid var(--line); background:#fff; border-radius:.6em; padding:.4em .8em; font-size:.8em; color:var(--ink); font-weight:700; white-space:nowrap; }
  .brand .tools { margin-left:auto; align-self:flex-start; display:flex; gap:.5em; }
  .brand .tools .fs { margin:0; }

  /* ── 럭키드로우 ── */
  #lucky { display:grid; grid-template-columns:1.55fr 1fr; grid-template-rows:auto minmax(0,1fr); gap:1.3em 1.6em; padding:1.8em 3em 2.2em;
           background:linear-gradient(135deg,#fff3ec 0%,#eef3ff 100%); }
  .lk-stage { flex:1; min-height:0; display:grid; gap:.7em; padding:.8em; }
  .lk-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4em; color:var(--muted); font-weight:600; text-align:center; }
  .lk-empty .big { font-size:3.5em; }
  .reel { position:relative; overflow:hidden; min-width:0; min-height:0; border-radius:.9em; border:2px solid var(--line);
          background:linear-gradient(#ffffff, #f4f6fb); }
  .reel::before, .reel::after { content:""; position:absolute; left:0; right:0; height:30%; pointer-events:none; z-index:2; }
  .reel::before { top:0; background:linear-gradient(#ffffffee, #ffffff00); }
  .reel::after { bottom:0; background:linear-gradient(#ffffff00, #ffffffee); }
  .reel-strip { will-change:transform; }
  .reel-strip.spinning { filter:blur(1.5px); }
  .reel-item { height:var(--rh, 6em); display:flex; align-items:center; justify-content:center; padding:0 .4em;
               font-weight:800; letter-spacing:-.02em; color:var(--ink); font-size:var(--fs, 2em); white-space:nowrap; overflow:hidden; }
  .reel.stopped { border-color:var(--accent); background:linear-gradient(#fff, #fff4ef);
                  box-shadow:0 0 0 .2em rgba(255,90,54,.18), 0 .5em 1.5em rgba(255,90,54,.25); animation:pop .28s cubic-bezier(.16,1,.3,1); }
  .reel.stopped .reel-item { color:var(--accent); }
  @keyframes pop { from { transform:scale(.92); } to { transform:scale(1); } }
  .lk-ctrl { display:flex; align-items:center; gap:1em; flex-wrap:wrap; }
  .lk-ctrl label { margin:0; display:flex; align-items:center; gap:.5em; font-size:.9em; font-weight:700; }
  .lk-ctrl input[type=number] { width:4.5em; padding:.45em .6em; }
  .lk-ctrl input[type=checkbox] { width:1.1em; height:1.1em; accent-color:var(--accent); }
  .lk-chip { margin-left:auto; padding:.35em .9em; border-radius:2em; background:#f6f7fb; border:1px solid var(--line); font-size:.85em; font-weight:700; color:var(--muted); }
  #lkGo:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .lk-btns { display:grid; grid-template-columns:1.25fr 1fr; gap:.8em; }
  #lkRace { border:2px solid var(--accent); border-radius:.8em; background:#fff; color:var(--accent); font-size:1.05em; font-weight:800; padding:.6em .8em; line-height:1.25; }
  #lkRace:hover:not(:disabled) { background:#fff4ef; }
  #lkRace:disabled { opacity:.45; cursor:default; }
  #lkRace small { display:block; font-size:.72em; font-weight:700; opacity:.85; }
  .lk-names { flex:1; min-height:0; display:flex; flex-direction:column; }
  #lkNames { flex:1; min-height:0; resize:none; line-height:1.5; }
  .lk-wins { max-height:11em; display:flex; flex-direction:column; min-height:0; }
  .lk-wins .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.5em; }
  .lk-wins .head b { font-size:.85em; }
  .lk-wins button { border:0; background:none; color:var(--muted); font-size:.8em; font-weight:700; padding:0; }
  .lk-wins button:hover { color:var(--accent); }
  #lkWinners { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.4em; overflow:auto; min-height:0; }
  #lkWinners li { padding:.3em .75em; border-radius:2em; background:#fff4ef; border:1px solid #ffd5c8; font-size:.85em; font-weight:700; }
  #lkWinners li i { font-style:normal; color:var(--accent); margin-right:.3em; }
  .lk-wins .none { color:var(--muted); font-size:.85em; }
  /* 픽셀아트 아이콘 */
  .pxi { height:1.2em; width:auto; vertical-align:-.24em; image-rendering:pixelated; image-rendering:crisp-edges; }
  .menu-card .ico img.pxi { height:1.1em; }
  .lk-empty .big .pxi { height:1em; }
  .pl .medal .pxi { height:1em; vertical-align:0; }
  .lbl .pxi { height:1.15em; margin-right:.15em; }
  .toast .pxi { margin-right:.1em; }
  /* 어두운 바탕(경기 버튼·알림·순위판) 위 아이콘: 얇은 흰 테두리로 또렷하게 */
  #ctrls .pxi, .toast .pxi, #hud .pxi { filter:drop-shadow(1px 0 0 rgba(255,255,255,.85)) drop-shadow(-1px 0 0 rgba(255,255,255,.85))
                                                drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 -1px 0 rgba(255,255,255,.85)); }
</style>
</head>
<body>
<div id="app">

<div id="menu" class="screen">
  <div class="menu-head">
    <img src="assets/lakeduck.png" alt="LAKE DUCK">
  </div>
  <div class="menu-cards">
    <button class="menu-card" type="button" id="goLucky">
      <div class="ico"><img class="pxi" data-px="slot" alt=""></div>
      <b>럭키드로우</b>
      <span>슬롯머신으로 당첨자를 뽑아요</span>
      <div class="go">시작하기</div>
    </button>
    <button class="menu-card" type="button" id="goRace">
      <div class="ico"><img src="assets/lakeduck.png" alt=""></div>
      <b>꽥꽥런</b>
      <span>오리 레이스로 순위를 정해요</span>
      <div class="go">시작하기</div>
    </button>
  </div>
  <div class="sponsor"><span>OFFICIAL SPONSOR</span><img src="assets/ostrya.png" alt="ostrya"></div>
</div>

<div id="lucky" class="screen" hidden>
  <div class="brand">
    <img class="logo" src="assets/lakeduck.png" alt="LAKE DUCK">
    <div>
      <h1>럭키드로우</h1>
      <p class="sub">레이크덕 럭키드로우</p>
    </div>
    <div class="tools">
      <button class="back" type="button" data-menu>← 메뉴</button>
      <button class="fs" type="button"><img class="pxi" data-px="full" alt=""> 전체화면</button>
    </div>
  </div>
  <div class="col">
    <div class="card lk-stage" id="lkStage"></div>
    <div class="lk-ctrl">
      <label>뽑을 인원 <input id="lkCount" type="number" min="1" max="12" value="1"></label>
      <label><input id="lkExclude" type="checkbox" checked> 당첨자는 다음 추첨에서 제외</label>
      <span class="lk-chip" id="lkRemain">남은 인원 0명</span>
    </div>
    <div class="lk-btns">
      <button id="lkGo">추첨하기</button>
      <button id="lkRace" type="button" title="럭키드로우 당첨자를 뺀 나머지가 꽥꽥런 주자가 돼요">당첨자 빼고 꽥꽥런</button>
    </div>
  </div>
  <div class="col">
    <div class="card lk-names">
      <label for="lkNames">참가자 <span class="cnt" id="lkCountLabel">0명</span></label>
      <textarea id="lkNames" placeholder="귤섬&#10;라이트래블&#10;캠핑앤스타일&#10;김레덕&#10;박레덕&#10;오레덕&#10;이레덕&#10;최레덕&#10;남궁레덕&#10;윤레덕&#10;구레덕&#10;손레덕&#10;고레덕"></textarea>
      <p class="hint">ENTER로 참가자를 구분해요. 꽥꽥런과 같은 명단이에요.</p>
    </div>
    <div class="card lk-wins">
      <div class="head"><b>당첨 기록 <span id="lkWinCount">0</span></b><button type="button" id="lkReset">초기화</button></div>

function stadiumCurve(S, R, s0, laps = 1) {

  const ev = (s, p, t) => {

    s -= S;
    if (s < A) { const th = -Math.PI / 2 + s / R; p.set(S + R * Math.cos(th), 0, R * Math.sin(th)); t.set(-Math.sin(th), 0, Math.cos(th)); return; }

    if (s < S) { p.set(S - s, 0, R); t.set(-1, 0, 0); return; }
    s -= S;
    const th = Math.PI / 2 + s / R; p.set(R * Math.cos(th), 0, R * Math.sin(th)); t.set(-Math.sin(th), 0, Math.cos(th));
  };

    loop: L,
    at: (s, p, t) => ev(s, p, t),
    getLength: () => total,
    getPointAt: (u, out = new THREE.Vector3()) => { ev(s0 + u * total, out, tmp); return out; },

function mkFrame() { return { p: new THREE.Vector3(), t: new THREE.Vector3(), s: new THREE.Vector3() }; }
function buildPath() {

}
// 도시 바둑판: 세로 도로 x = (i+0.5)·B, 가로 도로 z = j·B, 도로 폭 STREET, 인도 SIDEWALK

function buildCityPath() {

  const segs = [];                                         // [방향 x, 방향 z, 길이]
  let total = 0;
  const add = (dx, dz, L) => { segs.push([dx, dz, L]); total += L; };
  add(1, 0, B * randInt(1, 2) + B / 2);                    // 출발 직선: 블록 한가운데서 출발 → 첫 교차로

    if (rem - L < 70) {                                    // 마지막 직선(결승선은 블록 중간)
      if (rem < 45) segs[segs.length - 1][2] += rem; else add(turn[0], turn[1], rem);

// 진행거리 d → 위치 p, 진행방향 t, 옆방향 s. 트랙 밖(d<0, d>len)은 직선 연장.
function frameAt(d, o) {
  const x = clamp(d / trackLen, 0, 1) * LUT_N;
  const i = Math.min(LUT_N - 1, Math.floor(x)), f = x - i;
  o.p.lerpVectors(LUT_P[i], LUT_P[i + 1], f);
  o.t.lerpVectors(LUT_T[i], LUT_T[i + 1], f).normalize();

  o.s.set(-o.t.z, 0, o.t.x).normalize();

// 픽셀아트 흙길 텍스처: 가로 48px = 길 폭 전체, 세로로 반복. 흙 얼룩 · 바퀴 자국 · 자갈 · 가장자리 풀
function dirtTex() {
  const W = 48, H = 48, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), R = Math.random;
  const px = (x, y, col) => { if (x < 0 || x >= W) return; g.fillStyle = col; g.fillRect(x, ((y % H) + H) % H, 1, 1); };
  const BASE = ['#c18a55', '#b9824f', '#c99561', '#b47c49'];
  for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) px(x, y, BASE[(R() * BASE.length) | 0]);
  for (let k = 0; k < 16; k++) {                       // 밝은/어두운 흙 얼룩
    const cx = 4 + ((R() * (W - 8)) | 0), cy = (R() * H) | 0, r = 1.5 + R() * 2.5, col = R() < 0.5 ? '#d3a06a' : '#a46f40';
    for (let dx = -3; dx <= 3; dx++) for (let dy = -3; dy <= 3; dy++) if (dx * dx + dy * dy <= r * r && R() < 0.8) px(cx + dx, cy + dy, col);
  }
  for (const rx of [Math.round(W * 0.3), Math.round(W * 0.7)])   // 바퀴 자국
    for (let y = 0; y < H; y++) if (R() < 0.82) { px(rx, y, '#9a6538'); if (R() < 0.45) px(rx + 1, y, '#a46f40'); }
  for (let k = 0; k < 45; k++) {                       // 자갈
    const x = 3 + ((R() * (W - 6)) | 0), y = (R() * H) | 0;
    px(x, y, R() < 0.5 ? '#9a9a95' : '#7d7d78'); if (R() < 0.3) px(x + 1, y, '#b0b0aa');
  }
  for (let y = 0; y < H; y++) {                        // 가장자리: 진한 흙 테두리 + 풀
    px(0, y, '#8f5f33'); px(W - 1, y, '#8f5f33');
    px(1, y, R() < 0.5 ? '#8f5f33' : '#a46f40'); px(W - 2, y, R() < 0.5 ? '#8f5f33' : '#a46f40');
    if (R() < 0.45) px(0, y, R() < 0.5 ? '#4cae3c' : '#5cc046');
    if (R() < 0.45) px(W - 1, y, R() < 0.5 ? '#4cae3c' : '#5cc046');
    if (R() < 0.15) px(1, y, '#3f9a33');
    if (R() < 0.15) px(W - 2, y, '#3f9a33');
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8;
  return t;
}
// 도시 노면: 픽셀 아스팔트 + 흰 가장자리 실선 + 흰 차선 점선 3개 (가로 48px = 코스 폭)
function asphaltTex() {
  const W = 48, H = 48, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), R = Math.random;
  const BASE = ['#4a4d52', '#46494e', '#4f5257', '#43464b'];
  for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
    g.fillStyle = R() < 0.05 ? '#3a3c40' : R() < 0.04 ? '#5d6066' : BASE[(R() * BASE.length) | 0];

  for (const x of [12, 24, 35]) for (let y = 0; y < H; y += 12) g.fillRect(x, y, 1, 6);   // 차선 점선
  g.fillStyle = '#8a8f96'; g.fillRect(0, 0, 1, H); g.fillRect(W - 1, 0, 1, H);           // 연석
  const t = new THREE.CanvasTexture(c);

// 트랙 러닝 노면: 빨간 우레탄 + 흰 레인선 4개 레인 + 회색 연석 (가로 48px = 트랙 폭)

function buildTrackMesh() {
  // 출발 대기열(-25m)부터 결승 후(+15m)까지 길을 깐다. 텍스처 1칸 = 길 폭 기준 정사각 픽셀
  // 트랙 러닝은 실제 경기 거리와 상관없이 트랙 한 바퀴를 한 번만 깐다(겹쳐 그리면 깜빡임)

function buildGate(d, finish) {

  rect(L0, -8, L0 + 5.5, 8); rect(L1 - 5.5, -8, L1, 8);                 // 골 박스
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 8;
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: t })); m.position.y = -0.05; scene.add(m);
  // 운동장 한가운데 대형 ostrya 로고: 잔디 위 흰 페인트, 원본 해상도 그대로 픽셀아트처럼 (관중석 쪽에서 바로 읽힘)
  const lc = document.createElement('canvas'); lc.width = 234; lc.height = 154;
  const lt = new THREE.CanvasTexture(lc);
  lt.magFilter = THREE.NearestFilter; lt.minFilter = THREE.LinearMipmapLinearFilter; lt.anisotropy = 8;
  const paintLogo = () => {
    const q = lc.getContext('2d');
    q.clearRect(0, 0, lc.width, lc.height);
    q.drawImage(logoImg, 0, 0, lc.width, lc.height);
    q.globalCompositeOperation = 'source-in'; q.fillStyle = '#f4f4f0'; q.fillRect(0, 0, lc.width, lc.height);
    q.globalCompositeOperation = 'source-over';
    lt.needsUpdate = true;
  };
  if (logoImg.complete && logoImg.naturalWidth) paintLogo(); else logoImg.addEventListener('load', paintLogo, { once: true });
  const lg = new THREE.PlaneGeometry(LW, LH); lg.rotateX(-Math.PI / 2);
  const lm = new THREE.Mesh(lg, new THREE.MeshLambertMaterial({ map: lt, alphaTest: 0.5, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  lm.position.set(mid, -0.04, 0); scene.add(lm);
  // 골대 (흰 복셀)
  const gm = new THREE.MeshLambertMaterial({ color: 0xf4f4f0 });
  for (const gx of [L0, L1]) {
    for (const gz of [-3.66, 3.66]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.44, 0.2), gm); p.position.set(gx, 1.17, gz); scene.add(p); }
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 7.52), gm); bar.position.set(gx, 2.39, 0); scene.add(bar);
  }
}
// 관중석: 백 직선 바깥 5단 계단 (콘크리트 + 파랑/노랑 좌석 줄)
function buildStands(S, R) {
  const z0 = R + trackW / 2 + 3, len = S - 6, base = -0.25;
  const noise = pixelNoise(4, 4);
  const conc = new THREE.MeshLambertMaterial({ color: 0xc3c8cf, map: noise });
  const seatC = [0x1c7ed6, 0xf7cc1e];
  for (let k = 0; k < 5; k++) {
    const h = 0.6 * (k + 1), z = z0 + k * 1.6 + 0.8;
    const step = new THREE.Mesh(new THREE.BoxGeometry(len, h, 1.6), conc); step.position.set(S / 2, base + h / 2, z); scene.add(step);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(len, 0.35, 0.5), new THREE.MeshLambertMaterial({ color: seatC[k % 2], map: noise }));
    seat.position.set(S / 2, base + h + 0.17, z - 0.25); scene.add(seat);
  }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 4.2, 0.4), conc); wall.position.set(S / 2, base + 2.1, z0 + 8.2); scene.add(wall);
}

          g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(tx - PAD, ty - PAD, cw + PAD * 2, ch + PAD * 2);

        }
        for (let v = f * 4; v < f * 4 + 4; v++) {

function buildScenery() {

  return pixelNoise(18, 14, (g, w, h) => {
    for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) {
      let v = 0.9 + Math.random() * 0.1;
      if (o.pattern === 'sherpa') v = Math.random() < 0.35 ? 0.76 + Math.random() * 0.08 : 0.95 + Math.random() * 0.05;
      else if (o.pattern === 'waffle') v = ((x + y) % 2 ? 0.82 : 1) * (0.96 + Math.random() * 0.04);
      else if (o.pattern === 'quilt') v = y % 3 === 2 ? 0.66 : (y % 3 === 0 ? 1 : 0.9);
      else if (o.pattern === 'shell') v = (x === 4 || x === 13) ? 0.8 : 0.94 + Math.random() * 0.06;
      if (o.yoke === 'h' && y === Math.floor(h * 0.45)) v *= 0.72;
      if (o.yoke === 'v' && y < h * 0.55 && Math.abs(x - (w - 1) / 2) === Math.round((h * 0.55 - y) * 0.85)) v *= 0.72;

function mergeBoxes(list) {

  let off = 0;

    const g = new THREE.BoxGeometry(w * DUCK_P, h * DUCK_P, d * DUCK_P);
    if (rot) { g.rotateX(rot[0] || 0); g.rotateY(rot[1] || 0); g.rotateZ(rot[2] || 0); }   // 상자 중심 기준 회전
    g.translate(x * DUCK_P, y * DUCK_P, z * DUCK_P);

    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); uv.push(...g.attributes.uv.array);
    c.set(hex);
    for (let k = 0; k < n; k++) col.push(c.r, c.g, c.b);

  addBoxes(head, hb, mat);

  const hat = duckGroup('hat', [0, 9, 0], head);
  addBoxes(hat, [
    ...cbx(13.6, 0.8, 13.6, 0, -0.3, 0.3, DC.yellowDark, 0.3),
    ...cbx(11.8, 1, 11.8, 0, 0.5, 0.2, DC.yellow, 0.3),
    [9.3, 0.7, 9.3, 0, 1.35, 0, DC.brown],
    [0.5, 1.6, 1.4, 4.75, 1.2, -1.6, DC.brownDark],
    ...cbx(9, 4, 9, 0, 3.6, 0, DC.yellow, 0.5),
    ...cbx(7.4, 0.8, 7.4, 0, 5.9, 0, DC.yellow, 0.3),
    [0.3, 0.6, 0.6, 4.55, 4.2, 0, DC.black], [0.3, 0.6, 0.6, -4.55, 4.2, 0, DC.black],
    [0.4, 3.4, 1, 4.8, 3.2, -2.8, DC.beak, [-0.35, 0, 0]], [0.45, 1, 1, 4.8, 4.9, -3.4, DC.white, [-0.35, 0, 0]],   // 깃털

// 재킷 색별 원본을 한 번만 만들고 러너마다 clone (지오메트리·텍스처 공유)
// 배낭 색 12가지 (연출 전용 · 주자 번호로 정함 → 경기 결과와 무관)
const PACKS = ['#f7cc1e', '#e8453c', '#2f6fd6', '#3f9a4a', '#f08c2e', '#8a55c9',
               '#2b3a67', '#e86aa6', '#1fa3a3', '#5b6b3a', '#2a2a2e', '#8f969e'];
function duckFor(o, pack) {
  const key = OUTFITS.indexOf(o) + '|' + pack;
  if (!duckTemplates.has(key)) duckTemplates.set(key, buildDuck(Object.assign({}, o, { pack })));
  return duckTemplates.get(key).clone(true);
}

function makeRunner(name, i) {
  const o = OUTFITS[i % OUTFITS.length];
  const color = parseInt(o.base.slice(1), 16);
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const duck = duckFor(o, PACKS[i % PACKS.length]);
  duck.rotation.y = Math.PI / 2;                       // 오리 정면(+z) → 러너 정면(+x)
  duck.scale.setScalar(DUCK_SCALE);
  duck.position.y = 0.95 * DUCK_P * DUCK_SCALE;          // 밑창이 땅에 닿게
  body.add(duck);
  // 부스트·폭주 발광용: 이 러너만의 재질 (텍스처는 공유)
  let mat = null, jmat = null;
  duck.traverse(m => {
    if (m.userData.duckBody) { mat = mat || m.material.clone(); m.material = mat; }
    else if (m.userData.jacket) { jmat = jmat || m.material.clone(); m.material = jmat; }
  });
  const legs = [duck.getObjectByName('leg_L'), duck.getObjectByName('leg_R')];
  const arms = [duck.getObjectByName('arm_L'), duck.getObjectByName('arm_R')];
  const label = document.createElement('div');
  label.className = 'lbl'; label.textContent = name;
  label.style.borderLeftColor = '#' + color.toString(16).padStart(6, '0');
  $('labels').append(label);
  return {
    name, idx: i, color, root, body, mats: [mat, jmat], legs, arms, label,
    d: 0, lat: 0, latTarget: 0, zNext: rand(0.5, 1.8),
    speed: 0, target: rand(7, 12), tNext: rand(0.3, 1.2), ms: 0,
    phase: rand(0, 6.28), state: 'run', downT: 0,
    fxBoost: 0, fxRage: 0, magnet: null,
    finished: false, finOrder: 0, stopD: 0, finSide: 1,
  };
}

/* =========================================================
 *  경기 시작 / 정리
 * ========================================================= */
function parseNames(s) { return s.split(/[\n,]+/).map(x => x.trim()).filter(Boolean); }

function startFromSetup() {
  cfg.names = $('names').value;
  cfg.mode = $('mode').value;
  cfg.map = $('map').value;
  cfg.len = $('len').value;
  cfg.items = clamp(parseInt($('items').value) || 0, 0, 60);
  const names = parseNames(cfg.names);
  $('msg').textContent = '';
  if (names.length < 2) { $('msg').textContent = '참가자를 2명 이상 입력하세요.'; return; }
  if (names.length > MAX_N) { $('msg').textContent = '최대 ' + MAX_N + '명까지 가능합니다.'; return; }
  $('items').value = cfg.items;
  // 순위 게임: 시상대(3위)까지 정해지면 경기 종료. 2명이면 2위까지
  const podiumN = Math.min(3, names.length - 1);
  saveCfg();
  const st = $('seed').value.trim();
  const sd = st === '' ? (Math.random() * 0xFFFFFFFF) >>> 0 : (/^\d+$/.test(st) ? (Number(st) >>> 0) : hashSeed(st));
  raceOrigin = 'setup';
  beginRace({ names, winN: podiumN, mode: cfg.mode, items: cfg.items, map: cfg.map, len: cfg.len }, sd);
}

function beginRace(r, sd) {
  race = r; seed = sd;
  rng = mulberry32(seed);
  disposeScene();
  if (!renderer) {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    $('stage').appendChild(renderer.domElement);
  }
  $('setup').hidden = true; $('menu').hidden = true; $('lucky').hidden = true; $('result').hidden = true; $('race').hidden = false;
  onResize();

  const n = race.names.length;
  trackW = clamp(10 + n * 0.1, 12, 16);
  initGeos();
  scene = new THREE.Scene();
  const sky = mapDef().city ? 0xb8d8f0 : 0x9fd8ff;
  scene.background = new THREE.Color(sky);
  scene.fog = new THREE.Fog(sky, 90, 340);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x557755, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(40, 80, 30); scene.add(sun);

  // ── 이하 rng 소비 순서가 고정되어야 시드 재현이 됨 ──
  const M = mapDef();
  if (M.S) {                                   // 트랙 러닝: 결승선은 항상 홈 직선 60% 지점, 거리만큼 거슬러 출발
    const laps = lenDef().laps, loop = 2 * M.S + 2 * Math.PI * M.R;
    curve = stadiumCurve(M.S, M.R, M.S * 0.6 - loop * laps, laps);
  } else if (M.city) {                         // 도시: 바둑판 도로 코스
    curve = buildCityPath();
  } else {
    curve = new THREE.CatmullRomCurve3(buildPath());
    curve.arcLengthDivisions = 800;
  }
  trackLen = curve.getLength();
  buildLUT();
  buildTrackMesh();
  if (M.S && Number.isInteger(lenDef().laps)) buildGate(0, true);   // 정수 바퀴면 출발·결승 게이트가 같은 자리
  else { buildGate(0, false); buildGate(trackLen, true); }
  spawnItems(race.items);
  runners = race.names.map((nm, i) => makeRunner(nm, i));
  // 출발 슬롯 무작위 배정 (Fisher–Yates)
  const order = runners.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = randInt(0, i); [order[i], order[j]] = [order[j], order[i]]; }
  const cols = Math.max(3, Math.floor((trackW - 2) / 1.1));
  runners.forEach((r, i) => {
    const s = order[i];
    r.d = 0.6 - Math.floor(s / cols) * 1.3;           // 뒤 줄은 출발선 뒤에서 시작
    r.lat = r.latTarget = -((cols - 1) / 2) * 1.1 + (s % cols) * 1.1;
    scene.add(r.root);
  });
  buildScenery(); // 연출 전용(Math.random) — 경기 결과와 무관

  finishers = []; frameFin = []; crossedList = []; projectiles = []; fxList = [];
  crossed = 0; finCount = 0; endT = 0; acc = 0; lastT = 0; hudT = 0;
  speedMul = 1; camMode = 'follow'; slowNow = false; resultShown = false; finishCam = false; finishCamSkip = false;
  $('btnSpeed').innerHTML = pxHTML('ff') + ' 1x'; $('btnCam').innerHTML = pxHTML('camera') + ' 1등';
  $('toasts').innerHTML = ''; $('ranks').innerHTML = '';
  $('seedTag').textContent = '시드 ' + seed;
  $('progress').style.width = '0';
  syncVisuals(0);
  const lead = runners.reduce((a, b) => (b.d > a.d ? b : a));
  frameAt(lead.d - 14, TF); camPos.copy(TF.p).y += 7;
  frameAt(lead.d + 5, TF); camLook.copy(TF.p);
  state = 'countdown'; countT = 3.2;
  updateHUD();
  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function disposeScene() {
  if (scene) scene.traverse(o => {
    if (o.geometry && !o.geometry.userData.keep && !Object.values(G || {}).includes(o.geometry)) o.geometry.dispose();
    // 면마다 재질이 다른 메시(현수막)는 material이 배열
    for (const m of [].concat(o.material || [])) {
      if (m.map && !PERSIST.has(m.map) && !Object.values(texCache).includes(m.map)) m.map.dispose();
    }
  });
  for (const f of fxList) f.m.material.dispose();
  for (const p of projectiles) p.mark.material.dispose();
  scene = null; runners = []; items = []; projectiles = []; fxList = [];
  $('labels').innerHTML = '';
  state = 'idle';
}
// 스테이지(16:9) 실제 크기에 렌더러를 맞춘다. 큰 화면에서는 픽셀 비율을 낮춰 GPU 부하를 일정하게 유지.
let stageW = 1280, stageH = 720;
function onResize() {
  stageW = $('app').clientWidth || 1280; stageH = $('app').clientHeight || 720;
  if (!renderer) return;
  const budget = 1920 * 1080 * 1.3; // 렌더링 픽셀 상한
  const pr = Math.max(0.75, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(budget / (stageW * stageH))));
  renderer.setPixelRatio(pr);
  renderer.setSize(stageW, stageH, false);
  if (!camera) camera = new THREE.PerspectiveCamera(55, 16 / 9, 0.1, 800);
  camera.aspect = stageW / stageH; camera.updateProjectionMatrix();
}
new ResizeObserver(onResize).observe($('app'));

/* =========================================================
 *  시뮬레이션 (고정 스텝)
 * ========================================================= */
function toast(icon, text) {
  const el = document.createElement('div'); el.className = 'toast';
  if (icon) el.append(pxImg(icon));
  el.append(document.createTextNode(text));
  $('toasts').prepend(el); setTimeout(() => el.remove(), 2600);
  while ($('toasts').children.length > 5) $('toasts').lastChild.remove();
}
function knockDown(r, t, icon) {
  r.downT = r.state === 'down' ? Math.max(r.downT, t) : t;
  r.state = 'down'; r.magnet = null; r.hitIcon = icon || null;
}

function updateRunner(r, dt) {
  if (r.finished) { // 결승 후: 천천히 진행하며 트랙 옆으로 비켜섬
    if (r.d < r.stopD) r.d += 4 * dt;
    r.lat += (r.finSide * (trackW / 2 + 3) - r.lat) * Math.min(1, 1.6 * dt);
    r.phase += dt * 7;
    return;
  }
  const d0 = r.d;
  // 무작위 목표 속도 (0.5~1.4초마다 재추첨)
  r.tNext -= dt;
  if (r.tNext <= 0) {
    r.target = rand(7, 12.5);
    if (rand(0, 1) < 0.12) r.target = rand(13, 15.5); // 폭주
    if (rand(0, 1) < 0.08) r.target = rand(4, 5.5);   // 급감속
    r.tNext = rand(0.5, 1.4);
    if (rand(0, 1) < TRIP_CHANCE && r.state === 'run') { // 혼자 자빠짐
      knockDown(r, STUN_TRIP, 'dizzy');
      toast('dizzy', r.name + ' 혼자 넘어짐');
    }
  }
  if (r.fxBoost > 0) r.fxBoost -= dt;
  if (r.fxRage > 0) r.fxRage -= dt;

  if (r.state === 'down') {
    r.speed *= 1 - Math.min(1, 4 * dt);
    r.downT -= dt;
    if (r.downT <= 0) { r.state = 'run'; r.speed = 0; r.hitIcon = null; }
    r.ms = 0;
    return;
  }
  r.speed += (r.target - r.speed) * Math.min(1, 3 * dt);
  frameAt(r.d, TF);
  const slopeMul = clamp(1 - 1.7 * TF.t.y, 0.4, 1.8);  // 오르막 감속 · 내리막 가속
  let ms = r.speed * slopeMul * (r.fxBoost > 0 ? 1.5 : 1) * (r.fxRage > 0 ? 1.6 : 1);
  if (r.magnet) {
    r.magnet.t -= dt; ms += 14;
    if (r.magnet.t <= 0 || r.d >= r.magnet.tgt.d - 0.7 || r.magnet.tgt.finished) r.magnet = null;
  }
  r.ms = ms;
  r.d += ms * dt;
  r.phase += ms * 1.35 * dt;

  // 좌우 흔들림
  r.zNext -= dt;
  if (r.zNext <= 0) { r.latTarget = r.lat + rand(-3, 3); r.zNext = rand(0.5, 1.8); }
  const lim = trackW / 2 - 1;
  r.latTarget = clamp(r.latTarget, -lim, lim);
  r.lat += (r.latTarget - r.lat) * Math.min(1, 1.6 * dt);

  // 아이템 획득
  for (const it of items) {
    if (it.taken || Math.abs(it.d - r.d) > 0.9 || Math.abs(it.lat - r.lat) > 1.0) continue;
    it.taken = true; it.mesh.visible = false; it.respawn = ITEM_RESPAWN;
    applyItem(r, it.type);
    if (it.type === 'teleport') break;             // 순간이동한 자리의 상자는 다음 스텝부터
  }

  // 결승 통과: 이번 스텝 이동량 대비 오버슛 비율 기록 → 같은 스텝 동시 통과 정렬용
  if (r.d >= trackLen) {
    r.finished = true;
    r.stopD = trackLen + rand(3, 9);
    r.finSide = r.lat >= 0 ? 1 : -1;
    r.fxBoost = r.fxRage = 0; r.magnet = null;
    frameFin.push({ r, ot: (r.d - trackLen) / Math.max(0.001, r.d - d0) });
  }
}
function applyItem(r, type) {
  const T = ITEM_TYPES[type];
  if (type === 'boost') r.fxBoost = 2.5;
  else if (type === 'rage') r.fxRage = 3;
  else if (type === 'trap') knockDown(r, 1.3);
  else if (type === 'magnet') {
    let tgt = null;
    for (const o of runners) if (!o.finished && o !== r && o.d > r.d && (!tgt || o.d < tgt.d)) tgt = o;
    if (tgt) r.magnet = { tgt, t: 2.5 };
  } else if (type === 'teleport') {
    teleport(r);
    return;
  } else if (THROW[type]) {
    throwItem(r, type);
    return;
  }
  toast(T.px, r.name + ' — ' + T.label);
}
// 텔레포트: 아직 결승 안 한 다른 주자 중 하나를 rng로 골라 위치(거리·좌우)를 맞바꿈
function teleport(r) {
  const others = runners.filter(o => !o.finished && o !== r);
  if (!others.length) { toast('teleport', r.name + ' — 텔레포트 (바꿀 사람 없음)'); return; }
  const o = others[randInt(0, others.length - 1)];
  spawnFlash(r.d, r.lat); spawnFlash(o.d, o.lat);
  [r.d, o.d] = [o.d, r.d];
  [r.lat, o.lat] = [o.lat, r.lat];
  [r.latTarget, o.latTarget] = [o.latTarget, r.latTarget];
  r.magnet = o.magnet = null;
  toast('teleport', r.name + ' ⇄ ' + o.name + ' 자리 바꿈!');
}

/* ---------- 던지기 (폭탄 · 물풍선) ----------
 * 착탄 지점은 획득 순간 rng로 확정 → 시드 재현 유지.
 * 10~90m 앞에 사람이 있으면 가장 가까운 사람의 비행시간 뒤 예상 위치를 노리고, 없으면 40~60m 앞 아무 데나. */
function throwItem(r, type) {
  const cfgT = THROW[type], lim = trackW / 2 - 1;
  let tgt = null;
  for (const o of runners) if (!o.finished && o !== r && o.d > r.d + 10 && o.d < r.d + 90 && (!tgt || o.d < tgt.d)) tgt = o;
  const d1 = Math.min(tgt ? tgt.d + tgt.speed * cfgT.T : r.d + rand(40, 60), trackLen - 1);
  const lat1 = clamp((tgt ? tgt.lat : r.lat) + rand(-1, 1), -lim, lim);
  const p = { type, owner: r, d0: r.d, lat0: r.lat, d1, lat1, t: 0, T: cfgT.T,
              arc: clamp((d1 - r.d) * 0.6, 5, 40) };   // 멀리 던질수록 높게 (최고점 = arc/4)
  p.mesh = makeProjectileMesh(type); scene.add(p.mesh);
  // 착탄 예고 원
  p.mark = new THREE.Mesh(G.ring, new THREE.MeshBasicMaterial({ color: cfgT.mark, transparent: true, opacity: 0.55, depthWrite: false }));
  frameAt(d1, TF); p.mark.position.copy(TF.p).addScaledVector(TF.s, lat1); p.mark.position.y += 0.08;
  p.mark.rotation.x = -Math.PI / 2; p.mark.scale.setScalar(cfgT.R); scene.add(p.mark);
  projectiles.push(p);
  toast(ITEM_TYPES[type].px, r.name + (tgt ? ' → ' + tgt.name + ' 쪽으로 투척!' : ' 전방 투척!'));
}
function updateProjectiles(dt) {
  for (let i = 0; i < projectiles.length; i++) {
    const p = projectiles[i];
    p.t += dt;
    if (p.t < p.T) continue;
    const cfgT = THROW[p.type], R2 = cfgT.R * cfgT.R, hits = [];
    for (const o of runners) {
      if (o.finished || o === p.owner) continue;
      const dd = o.d - p.d1, dl = o.lat - p.lat1;
      if (dd * dd + dl * dl < R2) { knockDown(o, cfgT.stun, cfgT.icon); hits.push(o.name); }
    }
    spawnBlast(p);
    scene.remove(p.mesh); scene.remove(p.mark); p.mark.material.dispose();
    projectiles.splice(i--, 1);
    toast(cfgT.icon, ITEM_TYPES[p.type].label + ' 착탄 — ' + (hits.length ? hits.join(', ') + ' 넘어짐' : '빗나감'));
  }
}
function makeProjectileMesh(type) {
  const g = new THREE.Group();
  if (type === 'bomb') {
    g.add(new THREE.Mesh(G.ball, G.bombMat));
    const fuse = new THREE.Mesh(G.fuse, G.fuseMat); fuse.position.y = 0.36; g.add(fuse);
    const spark = new THREE.Mesh(G.spark, G.sparkMat); spark.position.y = 0.48; g.add(spark);
  } else {
    g.add(new THREE.Mesh(G.ball, G.waterMat));
    const knot = new THREE.Mesh(G.spark, G.waterMat); knot.position.y = 0.34; g.add(knot);
  }
  return g;
}
// 착탄 연출 (화면 전용 · 실제 시간 기준)
function spawnBlast(p) {
  const cfgT = THROW[p.type];
  frameAt(p.d1, TF);
  const m = new THREE.Mesh(G.blast, new THREE.MeshBasicMaterial({ color: cfgT.fx, transparent: true, opacity: 0.85, depthWrite: false }));
  m.position.copy(TF.p).addScaledVector(TF.s, p.lat1); m.position.y += 0.3;
  scene.add(m);
  fxList.push({ m, t: 0, T: p.type === 'bomb' ? 0.55 : 0.7, R: cfgT.R, flat: p.type === 'water' });
}
// 텔레포트 번쩍 (화면 전용)
function spawnFlash(d, lat) {
  frameAt(d, TF);
  const m = new THREE.Mesh(G.blast, new THREE.MeshBasicMaterial({ color: 0x9775fa, transparent: true, opacity: 0.85, depthWrite: false }));
  m.position.copy(TF.p).addScaledVector(TF.s, lat); m.position.y += 0.6;
  scene.add(m);
  fxList.push({ m, t: 0, T: 0.6, R: 1.4, flat: false });
}
function updateFx(rdt) {
  for (let i = 0; i < fxList.length; i++) {
    const f = fxList[i]; f.t += rdt;
    const k = Math.min(1, f.t / f.T), s = f.R * (0.25 + 0.75 * Math.sqrt(k));
    f.m.scale.set(s, f.flat ? s * 0.35 : s, s);
    f.m.material.opacity = 0.85 * (1 - k);
    if (k >= 1) { scene.remove(f.m); f.m.material.dispose(); fxList.splice(i--, 1); }
  }
}

// 겹친 러너를 좌우로 밀어냄. 폭주 상태면 부딪힌 상대를 넘어뜨림.
function separate() {
  const act = runners.filter(r => !r.finished).sort((a, b) => a.d - b.d || a.idx - b.idx);
  const lim = trackW / 2 - 1;
  for (let i = 0; i < act.length; i++) {
    const a = act[i];
    for (let j = i + 1; j < act.length && act[j].d - a.d < 0.8; j++) {
      const b = act[j], dd = a.d - b.d, dl = a.lat - b.lat, d2 = dd * dd + dl * dl;
      if (d2 >= 0.64 || d2 <= 0.0001) continue;
      const push = (0.8 - Math.sqrt(d2)) * 0.5 * (dl >= 0 ? 1 : -1);
      a.lat = clamp(a.lat + push, -lim, lim);
      b.lat = clamp(b.lat - push, -lim, lim);
      const ra = a.fxRage > 0, rb = b.fxRage > 0;
      if (ra !== rb) {
        const victim = ra ? b : a;
        if (victim.state === 'run') { knockDown(victim, 1.0); toast('boom', (ra ? a : b).name + ' → ' + victim.name + ' 넘어뜨림'); }
      }
    }
  }
}

function commitFinishers() {
  if (!frameFin.length) return;
  frameFin.sort((a, b) => b.ot - a.ot); // 오버슛이 클수록 먼저 들어온 것
  for (let i = 0; i < frameFin.length; i++) {
    const r = frameFin[i].r;
    r.finOrder = ++finCount;
    if (race.mode === 'last') {
      if (state !== 'running') continue;
      crossed++; crossedList.push(r);
      if (runners.length - crossed <= race.winN) {
        // 남은 사람 중 가장 뒤가 1순위
        finishers = runners.filter(x => !x.finished).sort((a, b) => a.d - b.d);
        // 같은 스텝에 함께 들어왔지만 아직 처리 안 된(=더 늦게 들어온) 사람 순으로 채움
        const rest = frameFin.slice(i + 1).sort((a, b) => a.ot - b.ot);
        for (const u of rest) if (finishers.length < race.winN) finishers.push(u.r);
        for (let k = crossedList.length - 1; finishers.length < race.winN && k >= 0; k--)
          if (!finishers.includes(crossedList[k])) finishers.push(crossedList[k]);
        finishers = finishers.slice(0, race.winN);
        state = 'ended';
      }
    } else if (finishers.length < race.winN) {
      finishers.push(r);
      toast('flag', finishers.length + '위 ' + r.name);
      if (finishers.length >= race.winN) state = 'ended';
    }
  }
  frameFin = [];
}

// 먹힌 상자 다시 생성 (경기 시간 기준 · 종류는 시드 난수로 다시 뽑아 재현 가능)
function respawnItems(dt) {
  for (const it of items) {
    if (!it.taken) continue;
    it.respawn -= dt;
    if (it.respawn > 0) continue;
    const type = ITEM_KEYS[randInt(0, ITEM_KEYS.length - 1)];
    if (type !== it.type) { it.type = type; it.mesh.material.map = emojiTex(type); it.mesh.material.needsUpdate = true; }
    it.taken = false; it.mesh.visible = true; it.appear = 0;          // appear: 화면 전용 등장 애니메이션
  }
}
function step(dt) {
  for (const r of runners) updateRunner(r, dt);
  updateProjectiles(dt);
  respawnItems(dt);
  separate();
  commitFinishers();
  if (state === 'ended') endT += dt;
}

// 승부를 가를 주자가 결승 3.5초 이내면 슬로모션 (시간 배율만 바꿈 → 결과에 영향 없음)
function decider() {
  const un = runners.filter(r => !r.finished).sort((a, b) => b.d - a.d);
  const need = race.mode === 'last' ? (runners.length - race.winN) - crossed : race.winN - finishers.length;
  return need >= 1 && need <= un.length ? un[need - 1] : null;
}
// 1등부터: 다음에 들어올 선두(1·2·3위가 정해지는 순간마다) / 꼴찌부터: 순위를 가를 주자
function watched() {
  if (race.mode === 'last') return decider();
  if (finishers.length >= race.winN) return null;
  let lead = null;
  for (const r of runners) if (!r.finished && (!lead || r.d > lead.d)) lead = r;
  return lead;
}
function computeSlow() {
  if (state !== 'running') return false;
  const dec = watched();
  return !!dec && (trackLen - dec.d) / Math.max(2, dec.speed) < 3.5;
}

/* =========================================================
 *  렌더링
 * ========================================================= */
function syncVisuals(rdt) {
  for (const r of runners) {
    frameAt(r.d, TF);
    const bob = r.finished ? Math.abs(Math.sin(r.phase)) * 0.4 : (r.state === 'run' ? Math.abs(Math.sin(r.phase)) * 0.12 : 0);
    r.root.position.set(TF.p.x + TF.s.x * r.lat, TF.p.y + bob, TF.p.z + TF.s.z * r.lat);
    r.root.rotation.y = Math.atan2(-TF.t.z, TF.t.x);
    // 오리 관절: 다리·팔은 오리 기준 x축 회전이 앞뒤 스윙
    if (r.finished) {               // 결승 후: 두 팔 번쩍
      r.body.rotation.z = 0;
      r.legs[0].rotation.x = r.legs[1].rotation.x = 0;
      r.arms[0].rotation.set(-2.9, 0, -0.35); r.arms[1].rotation.set(-2.9, 0, 0.35);
    } else if (r.state === 'down') { // 앞으로 엎어짐
      r.body.rotation.z = -1.35;
    } else {                         // 달리기: 다리 스윙 + 팔은 반대로 흔듦
      const sw = Math.sin(r.phase) * 0.85;
      r.body.rotation.z = -0.12;
      r.legs[0].rotation.x = sw; r.legs[1].rotation.x = -sw;
      r.arms[0].rotation.set(-sw * 0.8, 0, -0.12); r.arms[1].rotation.set(sw * 0.8, 0, 0.12);
    }
    r.root.scale.setScalar(r.fxRage > 0 ? 1.3 : 1);
    const em = r.fxRage > 0 ? 0x880000 : r.fxBoost > 0 ? 0x775500 : 0x000000;
    for (const m of r.mats) m.emissive.setHex(em);
  }
  for (const it of items) if (!it.taken) {
    it.ph += rdt * 2; it.mesh.rotation.y = it.ph;
    if (it.appear !== undefined && it.appear < 1) {                    // 다시 생길 때 톡 튀어나옴
      it.appear = Math.min(1, it.appear + rdt * 3.5);
      const k = it.appear, s = 1 + Math.sin(k * Math.PI) * 0.35;
      it.mesh.scale.setScalar(Math.max(0.01, k * s));
    }
  }
  for (const p of projectiles) { // 포물선 비행
    const s = Math.min(1, p.t / p.T), lat = p.lat0 + (p.lat1 - p.lat0) * s;
    frameAt(p.d0 + (p.d1 - p.d0) * s, TF);
    p.mesh.position.set(TF.p.x + TF.s.x * lat, TF.p.y + 1.8 * (1 - s) + 0.3 * s + p.arc * s * (1 - s), TF.p.z + TF.s.z * lat);
    p.mesh.rotation.x += rdt * 7;
    p.mark.material.opacity = 0.35 + 0.3 * Math.abs(Math.sin(p.t * 12));
  }
  updateFx(rdt);
}

// 결승 직전 카메라: 승부를 가를 주자가 결승 1.6초(경기 시간) 앞이면 결승선 옆으로 컷 전환.
// 트랙 바깥, 결승선 조금 지난 곳에서 빨간 선을 비스듬히 내려다봄 → 달려오는 모습과 선 통과가 한 화면에
let finishCam = false, finishCamSkip = false;
const FINISH_CAM_SEC = 1.6;
function finishCamPose(pos, look) {
  const side = -1, edge = trackW / 2;                    // 트랙 바깥쪽(트랙 러닝은 인필드 반대편)
  frameAt(trackLen + 5, TF2);                             // 선을 5m 지난 곳 → 게이트 기둥이 화면 가운데를 가리지 않음
  pos.copy(TF2.p).addScaledVector(TF2.s, side * (edge + 10)); pos.y = TF2.p.y + 3.4;
  frameAt(trackLen - 3, TF3);
  look.copy(TF3.p).addScaledVector(TF3.s, -side * 1); look.y = TF3.p.y + 1.0;
}
function nearFinish() {
  if (state === 'ended') return true;
  if (state !== 'running') return false;
  // 첫 주자가 결승 직전이면 컷 (이후 결과 창까지 유지 → 2·3위 통과도 같은 앵글)
  let dec = null;
  for (const r of runners) if (!r.finished && (!dec || r.d > dec.d)) dec = r;
  return !!dec && (trackLen - dec.d) / Math.max(2, dec.speed) < FINISH_CAM_SEC;
}
function updateCamera(rdt) {
  const un = runners.filter(r => !r.finished);
  const k = 1 - Math.exp(-3 * rdt);
  if (!finishCam && !finishCamSkip && nearFinish()) {     // 장면 전환(컷): 보간 없이 바로 이동
    finishCam = true;
    finishCamPose(camPos, camLook);
  }
  if (finishCam) {
    finishCamPose(TF2.p, TF3.p);                          // 고정 앵글 유지
    camPos.copy(TF2.p); camLook.copy(TF3.p);
  } else if (camMode === 'follow' || camMode === 'last') {
    // 1등: 아직 달리는 사람 중 선두 / 꼴등: 아직 달리는 사람 중 맨 뒤 (같은 뒤쪽 추적 앵글)
    const pick = camMode === 'last' ? (a, b) => (b.d < a.d ? b : a) : (a, b) => (b.d > a.d ? b : a);
    const focus = (camMode === 'follow' && state === 'ended' && finishers[0]) ? finishers[0]
      : un.length ? un.reduce(pick) : runners.reduce(pick);
    const fd = Math.min(focus.d, trackLen + 4);
    frameAt(fd - 12, TF2); TF2.p.y += 6.5;
    frameAt(fd + 5, TF3); TF3.p.y += 1;
    camPos.lerp(TF2.p, k); camLook.lerp(TF3.p, k);
  } else {
    const ds = (un.length ? un : runners).map(r => r.d);
    const mid = (Math.min(...ds) + Math.max(...ds)) / 2;
    frameAt(mid, TF2);
    const tgt = TF2.p.clone().addScaledVector(TF2.s, 38); tgt.y += 42;
    camPos.lerp(tgt, k); camLook.lerp(TF2.p, k);
  }
  camera.position.copy(camPos); camera.lookAt(camLook);
}

const V = new THREE.Vector3();
function updateLabels() {
  const w = stageW, h = stageH;
  const winSet = new Set(state === 'ended' ? finishers : []);
  for (const r of runners) {
    V.copy(r.root.position); V.y += 2.7 * r.root.scale.x;
    const dist = V.distanceTo(camera.position);
    V.project(camera);
    if (V.z > 1 || dist > 140 || Math.abs(V.x) > 1.2 || Math.abs(V.y) > 1.2) { r.label.style.display = 'none'; continue; }
    r.label.style.display = '';
    const x = (V.x + 1) / 2 * w, y = (1 - V.y) / 2 * h;
    const sc = clamp(26 / dist, 0.6, 1.3);
    r.label.style.transform = `translate(${x}px,${y}px) scale(${sc}) translate(-50%,-100%)`;
    const icon = r.state === 'down' ? (r.hitIcon || 'dizzy') : r.fxRage > 0 ? 'rage' : r.fxBoost > 0 ? 'boost' : r.magnet ? 'magnet' : '';
    if (r.label.dataset.icon !== icon || !r.label.dataset.ready) {
      r.label.dataset.icon = icon; r.label.dataset.ready = '1';
      r.label.replaceChildren(...(icon ? [pxImg(icon)] : []), document.createTextNode(r.name));
    }
    r.label.classList.toggle('win', winSet.has(r));
  }
}

function updateHUD() {
  const n = runners.length;
  $('goal').replaceChildren(pxImg(race.mode === 'last' ? 'turtle' : 'flag'), document.createTextNode(' ' + (race.mode === 'last'
    ? (state === 'ended' ? '꼴찌 순위 확정' : '남은 ' + (n - crossed) + '명 · 꼴찌 ' + race.winN + '위까지')
    : '결승 ' + finishers.length + ' / ' + race.winN)));
  // 전체 순위: 결승 통과 순서 → 그 뒤 현재 위치
  const order = runners.slice().sort((a, b) =>
    (a.finished && b.finished) ? a.finOrder - b.finOrder : a.finished ? -1 : b.finished ? 1 : b.d - a.d);
  // 10명까지 표시. 11명을 넘으면 10명 → … → 목록의 마지막 1명(1등부터 모드는 꼴찌, 꼴찌부터 모드는 선두)
  let list = order.map((r, i) => ({ r, rank: i + 1 }));
  if (race.mode === 'last') list.reverse();
  if (list.length > 11) list = [...list.slice(0, 10), null, list[list.length - 1]];
  const ol = $('ranks'); ol.innerHTML = '';
  list.forEach(item => {
    const li = document.createElement('li');
    if (!item) { li.className = 'gap'; li.textContent = '⋯'; ol.append(li); return; }
    const { r, rank } = item;
    const no = document.createElement('span'); no.className = 'no'; no.textContent = '#' + rank;
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = r.name;
    if (r.state === 'down' && !r.finished) nm.append(' ', pxImg(r.hitIcon || 'dizzy'));
    li.append(no, nm);
    if (rank <= 3) li.classList.add('top');
    if (r.finished) li.classList.add('done');
    ol.append(li);
  });
  const lead = Math.max(...runners.map(r => r.d));
  $('progress').style.width = clamp(lead / trackLen * 100, 0, 100) + '%';
}

function loop(t) {
  animId = requestAnimationFrame(loop);
  const rdt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
  lastT = t;
  if (state === 'countdown') {
    countT -= rdt;
    $('count').textContent = countT > 0.2 ? Math.ceil(countT - 0.2) : 'GO!';
    if (countT <= 0) { state = 'running'; setTimeout(() => { $('count').textContent = ''; }, 500); }
  } else if (state === 'running' || state === 'ended') {
    slowNow = computeSlow();
    $('slowTag').hidden = !slowNow;
    acc += rdt * speedMul * (slowNow ? 0.35 : 1);
    let steps = 0;
    while (acc >= DT && steps < 30) { step(DT); acc -= DT; steps++; }
    if (steps >= 30) acc = 0; // 렌더만 밀림 · 시뮬레이션 결과는 동일
    if (state === 'ended' && endT > 2.5 && !resultShown) showResult();
  }
  hudT -= rdt;
  if (hudT <= 0 && state !== 'idle') { updateHUD(); hudT = 0.2; }
  if (!scene) return;
  syncVisuals(rdt);
  updateCamera(rdt);
  renderer.render(scene, camera);
  updateLabels();
}

/* =========================================================
 *  결과
 * ========================================================= */
function showResult() {
  resultShown = true;
  updateHUD();
  // 순위: 당첨자(finishers) 다음으로 나머지를 이어 붙임
  //  1등부터: 결승 통과 순 → 아직 달리는 사람은 앞선 순 / 꼴찌부터: 뒤처진 순 → 늦게 들어온 순
  const rest = runners.filter(r => !finishers.includes(r));
  if (race.mode === 'last') rest.sort((a, b) => (a.finished && b.finished) ? b.finOrder - a.finOrder : a.finished ? 1 : b.finished ? -1 : a.d - b.d);
  else rest.sort((a, b) => (a.finished && b.finished) ? a.finOrder - b.finOrder : a.finished ? -1 : b.finished ? 1 : b.d - a.d);
  const ranking = [...finishers, ...rest];
  const pod = $('podium'); pod.innerHTML = '';
  for (const rank of [2, 1, 3]) {                       // 시상대 배치: 2위 · 1위 · 3위
    const r = ranking[rank - 1];
    const pl = document.createElement('div'); pl.className = 'pl p' + rank + (r ? '' : ' empty');
    const who = document.createElement('div'); who.className = 'who';
    const medal = document.createElement('div'); medal.className = 'medal'; medal.append(pxImg('medal:' + rank));
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r ? r.name : '-';
    who.append(medal, nm);
    const stepEl = document.createElement('div'); stepEl.className = 'step'; stepEl.textContent = rank;
    pl.append(who, stepEl); pod.append(pl);
  }
  const extra = finishers.slice(3).map(r => r.name);   // 당첨 인원이 3명보다 많으면 나머지도 표시
  $('moreWinners').textContent = extra.length ? '그 외 당첨: ' + extra.join(', ') : '';
  $('result').hidden = false;
}
let raceOrigin = 'setup';
function backToSetup() {
  cancelAnimationFrame(animId);
  disposeScene();
  $('race').hidden = true; $('result').hidden = true;
  showScreen(raceOrigin);                 // 꽥꽥런 설정 또는 럭키드로우(당첨자 빼고 꽥꽥런)로 복귀
}

/* =========================================================
 *  이벤트
 * ========================================================= */
$('go').onclick = startFromSetup;
const updateCount = () => {

  $('nameCount').textContent = n + '명';
};
$('names').addEventListener('input', updateCount); updateCount();
const toggleFull = () => {

  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
};

document.addEventListener('fullscreenchange', () => {
  document.querySelectorAll('.fs').forEach(b => { b.innerHTML = pxHTML('full') + (document.fullscreenElement ? ' 창 모드' : ' 전체화면'); });
});
// 카메라: 1등 추적 → 꼴등 추적 → 전체. 결승 컷 이후에 누르면 고른 시점으로 돌아감(다시 컷하지 않음)
const CAM_CYCLE = [['follow', 'camera', '1등'], ['last', 'turtle', '꼴등'], ['overview', 'map', '전체']];
$('btnCam').onclick = () => {

};
$('btnSpeed').onclick = () => {

  $('btnSpeed').innerHTML = pxHTML('ff') + ' ' + speedMul + 'x';
};
$('btnQuit').onclick = backToSetup;
$('btnBack').onclick = backToSetup;
$('btnReplay').onclick = () => beginRace(race, seed);
$('btnAgain').onclick = () => beginRace(race, (Math.random() * 0xFFFFFFFF) >>> 0);

/* =========================================================
 *  화면 전환: 메뉴(최초 진입) · 럭키드로우 · 꽥꽥런 설정
 * ========================================================= */
// 아이템 소개 팝업 (설정 화면)
(() => {
  const icons = $('itemGuideIcons'), list = $('itemGuideList');
  for (const k of ITEM_KEYS) {

  $('itemGuide').addEventListener('click', e => { if (e.target === $('itemGuide')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
function showScreen(id) {
  for (const s of ['menu', 'lucky', 'setup']) $(s).hidden = s !== id;
  if (id === 'setup') { $('names').value = cfg.names; updateCount(); }
  if (id === 'lucky') { $('lkNames').value = cfg.names; LK.render(); }
}
$('goLucky').onclick = () => showScreen('lucky');
$('goRace').onclick = () => showScreen('setup');
document.querySelectorAll('[data-menu]').forEach(b => { b.onclick = () => { if (!LK.spinning) showScreen('menu'); }; });
// 꽥꽥런 명단도 입력 즉시 저장 → 럭키드로우와 같은 명단을 씀
$('names').addEventListener('input', () => { cfg.names = $('names').value; saveCfg(); });

/* =========================================================
 *  럭키드로우 (슬롯머신)
 *  - 당첨자는 먼저 공정하게 뽑아 두고(Fisher–Yates 부분 셔플), 릴은 그 결과를 보여주는 연출
 *  - 릴은 들러리 이름들을 빠르게 지나 감속(easeOutQuint)하며 마지막 칸(당첨자)에 멈춤
 *  - 여러 명이면 릴마다 조금씩 늦게 멈춰 마지막까지 긴장감 유지
 * ========================================================= */
const LK = (() => {
  let winners = [], spinning = false, anims = [];
  const names = () => [...new Set(parseNames(cfg.names))];            // 중복 이름은 한 번만
  const pool = () => $('lkExclude').checked ? names().filter(n => !winners.includes(n)) : names();
  // 공정한 무작위 추첨: 앞의 count개만 교환하는 Fisher–Yates
  function pickRandom(arr, count) {
    const a = arr.slice(), n = Math.min(count, a.length);
    for (let i = 0; i < n; i++) {
      const j = i + Math.floor(Math.random() * (a.length - i));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, n);
  }
  function stageEmpty() {
    const st = $('lkStage'); st.innerHTML = ''; st.style.gridTemplateColumns = '1fr'; st.style.gridAutoRows = '1fr';
    const e = document.createElement('div'); e.className = 'lk-empty';
    e.innerHTML = '<div class="big">' + (SLOT3D_URL ? `<img class="icon3d" alt="" src="${SLOT3D_URL}">` : pxHTML('slot')) + '</div><div>추첨하기를 누르면 슬롯이 돌아가요</div>';
    st.append(e);
  }
  function draw() {
    if (spinning) return;
    const p = pool();
    const count = Math.min(clamp(parseInt($('lkCount').value) || 1, 1, 12), p.length);
    if (count <= 0) return;
    const picked = pickRandom(p, count);
    anims.forEach(cancelAnimationFrame); anims = [];
    spinning = true; render();
    const st = $('lkStage'); st.innerHTML = '';
    const cols = count <= 3 ? count : count <= 8 ? Math.ceil(count / 2) : Math.ceil(count / 3);
    st.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    st.style.gridAutoRows = 'minmax(0, 1fr)';
    const decoys = names();
    let pending = count;
    const stagger = Math.min(750, 3600 / Math.max(1, count - 1));
    picked.forEach((winner, i) => {
      const reel = document.createElement('div'); reel.className = 'reel';
      const strip = document.createElement('div'); strip.className = 'reel-strip spinning';
      const len = 26 + i * 5;
      const seq = [];
      for (let k = 0; k < len - 1; k++) seq.push(decoys[Math.floor(Math.random() * decoys.length)]);
      seq.push(winner);                                                  // 마지막 칸 = 당첨자
      let last = null;
      for (const nm of seq) { const it = document.createElement('div'); it.className = 'reel-item'; it.textContent = nm; strip.append(it); last = it; }
      reel.append(strip); st.append(reel);
      const duration = 2400 + i * stagger, start = performance.now();
      const fit = () => {                                                // 칸 높이·글자 크기 = 릴 크기에 맞춤
        const h = reel.clientHeight, w = reel.clientWidth;
        const longest = Math.max(...seq.map(s => s.length), 2);
        reel.style.setProperty('--rh', h + 'px');
        reel.style.setProperty('--fs', Math.max(12, Math.min(h * 0.34, (w - 16) / (longest * 1.05))) + 'px');
        return h;
      };
      const tick = now => {
        const h = fit();
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 5);
        strip.style.transform = `translateY(${-(seq.length - 1) * h * eased}px)`;
        if (t < 1) {
          if (t > 0.9) strip.classList.remove('spinning');
          anims.push(requestAnimationFrame(tick));
          return;
        }
        strip.replaceChildren(last); strip.style.transform = 'none'; strip.classList.remove('spinning');
        reel.classList.add('stopped');
        if (!winners.includes(winner)) winners.push(winner);             // 공개되는 순간 당첨 확정
        if (--pending === 0) spinning = false;
        render();
      };
      anims.push(requestAnimationFrame(tick));
    });
  }
  function render() {
    const all = names(), remain = pool().length;
    $('lkCountLabel').textContent = all.length + '명';
    $('lkRemain').textContent = '남은 인원 ' + remain + '명';
    $('lkGo').disabled = spinning || remain === 0;
    $('lkGo').textContent = spinning ? '추첨 중…' : winners.length ? '다시 추첨' : '추첨하기';
    $('lkCount').disabled = spinning; $('lkExclude').disabled = spinning;
    const runnersLeft = all.filter(n => !winners.includes(n)).length;      // 당첨자는 항상 주자에서 제외
    $('lkRace').disabled = spinning || winners.length === 0 || runnersLeft < 2;
    $('lkRace').innerHTML = '당첨자 빼고 꽥꽥런<small>' +
      (winners.length === 0 ? '먼저 추첨을 해 주세요' : runnersLeft < 2 ? '남은 인원이 2명 이상이어야 해요' : '남은 ' + runnersLeft + '명이 주자로 출전') + '</small>';
    $('lkWinCount').textContent = winners.length;
    const ul = $('lkWinners'); ul.innerHTML = '';
    if (!winners.length) { const li = document.createElement('li'); li.className = 'none'; li.style.cssText = 'background:none;border:0;padding:0'; li.textContent = '아직 당첨자가 없어요'; ul.append(li); }
    winners.forEach((w, i) => { const li = document.createElement('li'); const n = document.createElement('i'); n.textContent = (i + 1) + '.'; li.append(n, document.createTextNode(w)); ul.append(li); });
    if (!spinning && !$('lkStage').querySelector('.reel')) stageEmpty();
  }
  $('lkGo').onclick = draw;
  // 당첨자를 뺀 나머지로 바로 꽥꽥런 경기 (설정은 꽥꽥런 화면의 맵·거리·순위 방식·아이템 그대로, 저장된 명단은 그대로 둠)
  $('lkRace').onclick = () => {
    if (spinning) return;
    const runnersNames = names().filter(n => !winners.includes(n));
    if (runnersNames.length < 2 || winners.length === 0) return;
    raceOrigin = 'lucky';
    beginRace({ names: runnersNames.slice(0, MAX_N), winN: Math.min(3, runnersNames.length - 1), mode: cfg.mode, items: cfg.items,
                map: cfg.map, len: cfg.len }, (Math.random() * 0xFFFFFFFF) >>> 0);
  };
  $('lkReset').onclick = () => { if (spinning) return; winners = []; anims.forEach(cancelAnimationFrame); anims = []; stageEmpty(); render(); };
  $('lkNames').addEventListener('input', () => { cfg.names = $('lkNames').value; saveCfg(); render(); });
  $('lkExclude').addEventListener('change', render);
  return { render, get spinning() { return spinning; }, get winners() { return winners; } };
})();
showScreen('menu');

// 메뉴 카드 그림: 3D 복셀 모델을 비스듬한 정면에서 한 번 그려 PNG로 씀 (WebGL이 안 되면 기존 그림 유지)
function renderIcon(obj, center, dir, dist) {
  const W = 360, H = 360;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(W, H, false);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.0));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(3, 5, 4); sc.add(sun);
  sc.add(obj);
  const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 50);
  cam.position.copy(center).addScaledVector(dir.clone().normalize(), dist); cam.lookAt(center);
  r.render(sc, cam);
  const url = r.domElement.toDataURL('image/png');
  r.dispose(); r.forceContextLoss();
  return url;
}
// Voxel Emoji Set 의 🎰 슬롯머신 (박스 구성 그대로, 단위 ×DUCK_P)
function buildSlotMachine() {
  const g = new THREE.Group(), noise = pixelNoise(4, 4);
  const box = (color, [w, h, d], [x, y, z], faceMap) => {
    const plain = new THREE.MeshLambertMaterial({ color, map: noise });
    const mats = faceMap ? [plain, plain, plain, plain, new THREE.MeshLambertMaterial({ color, map: faceMap }), plain] : plain;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w * DUCK_P, h * DUCK_P, d * DUCK_P), mats);
    m.position.set(x * DUCK_P, y * DUCK_P, z * DUCK_P); g.add(m); return m;
  };
  box('#2b2b2e', [20, 3, 13], [0, 1.5, 0]);          // 받침
  box('#d8322a', [18, 20, 12], [0, 13, 0]);          // 빨간 몸체
  box('#f7cc1e', [20, 3, 13], [0, 24.5, 0]);         // 노란 뚜껑
  box('#dfac12', [12, 4, 5], [0, 28, 0]);            // 간판
  box('#2b2b2e', [16, 9, 0.6], [0, 16, 6.2]);        // 창
  const seven = pixelNoise(8, 12, gg => {             // 릴의 빨간 7
    gg.fillStyle = '#d8322a'; gg.fillRect(1, 2, 6, 2);
    [[5, 4], [5, 5], [4, 6], [4, 7], [3, 8], [3, 9]].forEach(([x, y]) => gg.fillRect(x, y, 2, 1));
  });
  [-5, 0, 5].forEach(x => box('#f7f6f1', [4, 6, 0.8], [x, 16, 6.4], seven));
  box('#f7cc1e', [10, 2, 3], [0, 5, 6.5]);           // 동전 받침
  box('#f7cc1e', [3, 1.5, 2], [-4, 9.5, 6.4]);       // 버튼
  box('#8d9196', [2, 4, 4], [10, 12, 0]);            // 레버 받침
  box('#a3a7ab', [1.4, 11, 1.4], [11.5, 18, 0]);     // 레버
  box('#b02822', [3.4, 3.4, 3.4], [11.5, 24.5, 0]);  // 레버 손잡이
  return g;
}
let SLOT3D_URL = null;
try {
  // 꽥꽥런: 경기용 복셀 오리 (깃대 빼고 몸통·머리 기준 프레이밍)
  const duckURL = renderIcon(buildDuck({ base: '#8b5a2f', trim: '#a7703c', collar: '#8b5a2f', zip: '#5c3a1c', zipType: 'half' }),
    new THREE.Vector3(0, 1.0, 0.15), new THREE.Vector3(0.42, 0.24, 1), 4.3);
  const di = document.querySelector('#goRace .ico img'); di.src = duckURL; di.classList.add('icon3d');
  // 럭키드로우: 복셀 슬롯머신
  SLOT3D_URL = renderIcon(buildSlotMachine(), new THREE.Vector3(0.08, 0.72, 0), new THREE.Vector3(0.38, 0.22, 1), 3.6);

// 나무·바위 복셀 모델은 처음 만들 때 1초 가까이 걸리므로, 페이지가 뜬 뒤 미리 만들어 둔다
